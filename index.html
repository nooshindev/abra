<style id="abra-style">body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: a always-dark night hero (lit cup, rising smoky steam, drifting sparks) ending in a wave edge; below it a sticky category strip with scroll-spy and lifted product cards. Owner drawer slides in from the start edge. */
:root{
  --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --hero-a:#120a06; --hero-b:#33200f; --hero-ink:#f8ecd6; --hero-muted:#cdb99c; --glow:#e9a650; --cl-main:#f0e2c8; --cl-shade:#c4a77f; --cl-hi:#fff8ea;
  --bg:#f3e9d7; --card:#fbf4e6; --ink:#2a1a10; --muted:#755f4b; --line:#dfcdb0; --soft:#ecdcc0;
  --accent:#d99a4a; --accent-ink:#2a1708; --price:#85441a;
  --btn:#2a1a10; --btn-ink:#f8ecd6; --danger:#b3321f;
  --shadow:0 6px 18px rgba(60,35,15,.10); --shadow-hi:0 14px 30px rgba(60,35,15,.18); --ph:#c4a77f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150d08; --card:#241610; --ink:#f4e8d2; --muted:#bba88e; --line:#3b281b; --soft:#2f1e14;
  --accent:#e0a458; --accent-ink:#2a1708; --price:#ebb978; --btn:#e0a458; --btn-ink:#1d1006; --danger:#ff9a85;
  --shadow:0 6px 18px rgba(0,0,0,.4); --shadow-hi:0 14px 30px rgba(0,0,0,.55); --ph:#6e5238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150d08; --card:#241610; --ink:#f4e8d2; --muted:#bba88e; --line:#3b281b; --soft:#2f1e14;
  --accent:#e0a458; --accent-ink:#2a1708; --price:#ebb978; --btn:#e0a458; --btn-ink:#1d1006; --danger:#ff9a85;
  --shadow:0 6px 18px rgba(0,0,0,.4); --shadow-hi:0 14px 30px rgba(0,0,0,.55); --ph:#6e5238; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.8}
#app{overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.55rem .85rem;width:100%;min-width:0}
textarea{resize:vertical;min-height:4.5rem}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

.hero .wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero-text{flex:1 1 300px;min-width:0}
.eyebrow{margin:0;font-size:.95rem;letter-spacing:.05em;color:var(--hero-muted)}
.brand{font-family:var(--font-display);font-weight:400;font-size:clamp(5rem,20vw,9.5rem);line-height:1.05;margin:.05em 0;background:linear-gradient(180deg,#fff3dc 10%,#e6b068 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 28px rgba(255,170,80,.32))}
.tag{font-size:1.15rem;color:var(--hero-ink);margin:0 0 18px;max-width:28ch;text-wrap:balance;opacity:.92}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.fact{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--hero-ink);border-radius:999px;padding:.05rem .95rem;font-size:.9rem;backdrop-filter:blur(6px)}
.cta{border:0;background:var(--glow);color:#2b1a05;font-weight:700;border-radius:999px;padding:.45rem 1.5rem;box-shadow:0 8px 24px rgba(255,170,80,.35);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,170,80,.5)}
.scene{position:relative;flex:0 1 360px;width:min(360px,78%);margin-inline:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scene svg{position:relative;z-index:1;display:block;width:100%;height:auto;overflow:visible;transform:translate(calc(var(--px,0) * 16px),calc(var(--py,0) * 10px));transition:transform .3s ease-out}
.scene .halo{position:absolute;inset:6% 4% 8%;border-radius:50%;background:radial-gradient(circle,rgba(255,181,92,.5) 0%,rgba(255,181,92,.14) 45%,transparent 70%);animation:breathe 5s ease-in-out infinite;transform:translate(calc(var(--px,0) * -22px),calc(var(--py,0) * -14px))}
.scene.hot .halo{animation:none;opacity:1;transform:scale(1.14)}
.scene .hint{position:absolute;inset-inline:0;bottom:-6px;text-align:center;font-size:.78rem;color:var(--hero-muted);opacity:.8;margin:0}
.wisp{fill:none;stroke:rgba(255,246,232,.7);stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:steam 7s ease-in-out infinite}
.wisp.once{animation:steam 3.4s ease-out 1 forwards}
.sparks{position:absolute;inset:0;pointer-events:none}
.hc{position:absolute;pointer-events:none;animation:drift 40s ease-in-out infinite alternate;filter:drop-shadow(0 0 22px rgba(255,181,92,.22))}
.hc svg,.cloud-up svg{display:block;width:100%;height:auto}
.hc1{top:34px;inset-inline-end:-24px;width:210px}
.hc2{bottom:96px;inset-inline-end:7%;width:140px;animation-duration:52s}
.hc3{top:70px;inset-inline-start:40%;width:120px;opacity:.45;animation-duration:60s}
.hc4{bottom:100px;inset-inline-start:-50px;width:220px;opacity:.28;animation-duration:46s}
.cloud-up{position:absolute;z-index:0;pointer-events:none;top:-92px;left:50%;width:74%;transform:translateX(-50%);animation:bob 8s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,181,92,.3))}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(28px)}}
@keyframes bob{50%{transform:translate(-50%,-7px)}}
.spark{position:absolute;bottom:-10px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 2px rgba(255,181,92,.7);opacity:0;animation:spark 12s linear infinite}
.wave{position:absolute;inset-inline:-5%;bottom:-1px;width:110%;height:78px;z-index:2;display:block}
.wave path{fill:var(--bg)}
.wave .w2{opacity:.45;animation:sway 9s ease-in-out infinite alternate}
@keyframes steam{0%{transform:translateY(24px) scale(.7,.5);opacity:0}22%{opacity:.85}70%{opacity:.4}100%{transform:translateY(-46px) translateX(var(--dx,10px)) scale(1.3,1.15);opacity:0}}
@keyframes breathe{50%{opacity:.7;transform:scale(1.07) translate(calc(var(--px,0) * -22px),calc(var(--py,0) * -14px))}}

/* ---------- GitHub publishing ---------- */
var gh={owner:'',repo:'',token:''};
var imgCache={};
function isrc(u){return imgCache[u]||u}
function ghLoad(){
  var o={};try{o=JSON.parse(localStorage.getItem('abra-gh')||'{}')||{}}catch(e){}
  var m=location.hostname.match(/^([^.]+)\.github\.io$/i);
  var seg=location.pathname.split('/').filter(Boolean)[0];
  gh.owner=o.owner||(m?m[1]:'');
  gh.repo=o.repo||((m&&seg&&seg.indexOf('.')<0)?seg:'');
  gh.token=o.token||'';
}
function ghStore(){try{localStorage.setItem('abra-gh',JSON.stringify(gh))}catch(e){}}
function ghApi(path){return 'https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/'+encodeURIComponent(gh.repo)+'/contents/'+path}
function ghHeaders(){return {'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function utf8ToB64(s){var b=new TextEncoder().encode(s),bin='';for(var i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);return btoa(bin)}
function b64ToUtf8(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a)}
function ghError(status){
  if(status===401)return 'توکن معتبر نیست یا منقضی شده. یک توکن جدید بساز.';
  if(status===403)return 'توکن اجازه‌ی نوشتن ندارد. در تنظیمات توکن، Contents را روی Read and write بگذار.';
  if(status===404)return 'مخزن پیدا نشد یا توکن به آن دسترسی ندارد. نام کاربری، نام مخزن و دسترسی توکن را بررسی کن.';
  if(status===409||status===422)return 'فایل هم‌زمان تغییر کرده. دوباره امتحان کن.';
  return 'خطای گیت‌هاب ('+status+'). کمی بعد دوباره امتحان کن.';
}
async function ghGetSha(path){
  var r=await fetch(ghApi(path)+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok){var e=new Error('gh');e.status=r.status;throw e}
  var j=await r.json();return j.sha||null;
}
async function ghPut(path,b64,msg,sha){
  var body={message:msg,content:b64};if(sha)body.sha=sha;
  var r=await fetch(ghApi(path),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok){var e=new Error('gh');e.status=r.status;throw e}
  return r.json();
}
function validMenu(j){return j&&j.cafe&&Array.isArray(j.categories)&&Array.isArray(j.products)}
function loadRemote(){
  var t=new Promise(function(res){setTimeout(res,6000)});
  var f=fetch('menu.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(validMenu(j))state=j}).catch(function(){});
  return Promise.race([f,t]);
}
async function loadAdminCopy(){
  try{
    var r=await fetch(ghApi('menu.json')+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
    if(r.ok){var j=await r.json();var o=JSON.parse(b64ToUtf8(String(j.content||'').replace(/\n/g,'')));if(validMenu(o))state=o}
    else if(r.status===401){toast(ghError(401))}
  }catch(e){}
}
async function publish(){
  if(saving||!dirty())return;
  if(!gh.token||!gh.owner||!gh.repo){ui.open=true;ui.tab='conn';ui.form=null;renderDrawer();toast('اول اتصال به گیت‌هاب را تنظیم کن');return}
  saving=true;renderBar();renderDrawer();
  try{
    var d=clone(draft),stamp=Date.now().toString(36);
    for(var i=0;i<d.products.length;i++){
      var p=d.products[i];
      if(p.img&&p.img.indexOf('data:')===0){
        var path='images/'+String(p.id).replace(/[^a-z0-9_-]/gi,'')+'-'+stamp+'.jpg';
        await ghPut(path,p.img.split(',')[1],'افزودن عکس محصول');
        imgCache[path]=p.img;p.img=path;
      }
    }
    var b64=utf8ToB64(JSON.stringify(d,null,1)+'\n');
    var sha=await ghGetSha('menu.json');
    try{await ghPut('menu.json',b64,'به‌روزرسانی منو',sha)}
    catch(e){
      if(e&&(e.status===409||e.status===422)){sha=await ghGetSha('menu.json');await ghPut('menu.json',b64,'به‌روزرسانی منو',sha)}
      else throw e;
    }
    state=d;draft=null;saveDraft();
    toast('منتشر شد. تا یکی دو دقیقه دیگر روی سایت دیده می‌شود.');
  }catch(e){
    toast(e&&e.status?ghError(e.status):'اتصال به گیت‌هاب برقرار نشد. اینترنت را بررسی کن.');
  }
  saving=false;renderHero();renderMenu();renderBar();renderDrawer();
}
function connTab(){
  return '<p class="note">با این اتصال، دکمه‌ی «انتشار تغییرات» مستقیم روی سایتت می‌نویسد و دیگر لازم نیست فایل دانلود و آپلود کنی. این کار فقط یک بار لازم است.</p>'+
   '<ol class="steps">'+
   '<li>به <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> برو.</li>'+

   field('g-owner','نام کاربری گیت‌هاب',gh.owner,'dir="ltr" autocomplete="off"')+
   field('g-repo','نام مخزن',gh.repo,'dir="ltr" autocomplete="off"')+
   '<div class="field"><label for="g-token">توکن'+(gh.token?' (ذخیره شده است، برای عوض کردن توکن جدید بچسبان)':'')+'</label><input id="g-token" type="password" dir="ltr" autocomplete="off" placeholder="'+(gh.token?'••••••••••••':'github_pat_…')+'"></div>'+
   '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="ghsave">ذخیره و آزمایش اتصال</button>'+(gh.token?'<button class="btn danger" data-act="ghout">قطع اتصال</button>':'')+'</div>'+
   '<p class="note" id="g-status" role="status">'+(gh.token?'اتصال ذخیره شده است.':'')+'</p>'+
   '<p class="note">توکن فقط در همین مرورگر ذخیره می‌شود و داخل فایل‌های سایت نمی‌رود. روی کامپیوتر یا گوشی عمومی واردش نکن.</p>';
}
async function ghSave(){
  var o=$('#g-owner').value.trim(),r=$('#g-repo').value.trim(),t=$('#g-token').value.trim()||gh.token;
  var st=$('#g-status');
  if(!o||!r||!t){st.textContent='نام کاربری، نام مخزن و توکن را پر کن.';return}
  var prev={owner:gh.owner,repo:gh.repo,token:gh.token};
  gh.owner=o;gh.repo=r;gh.token=t;
  st.textContent='در حال آزمایش اتصال…';
  try{
    var res=await fetch('https://api.github.com/repos/'+encodeURIComponent(o)+'/'+encodeURIComponent(r),{headers:ghHeaders(),cache:'no-store'});
    if(!res.ok){gh=prev;st.textContent=ghError(res.status);return}
    var j=await res.json();
    if(j.permissions&&j.permissions.push===false){gh=prev;st.textContent='توکن فقط اجازه‌ی خواندن دارد. Contents را روی Read and write بگذار.';return}
    ghStore();
    st.textContent='اتصال برقرار شد.';
    if(!draft){await loadAdminCopy()}
    renderHero();renderMenu();renderBar();
    toast('اتصال ذخیره شد');
  }catch(e){gh=prev;st.textContent='اتصال برقرار نشد. اینترنت را بررسی کن.'}
}
function ghOut(){
  gh.token='';
  try{localStorage.removeItem('abra-gh')}catch(e){}
  ui.tab='conn';renderDrawer();toast('اتصال قطع شد');
}

function readImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var im=new Image();
      im.onerror=rej;
      im.onload=function(){
        var m=720,k=Math.min(1,m/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function moveCat(id,dir){
  edit(function(d){
    var i=d.categories.findIndex(function(c){return c.id===id}),j=i+dir;
    if(i<0||j<0||j>=d.categories.length)return;
    var t=d.categories[i];d.categories[i]=d.categories[j];d.categories[j]=t;
  });
  renderDrawer();
}

function saveForm(){
  var d=cur(), f=ui.form;
  var name=$('#f-name').value.trim(), price=parsePrice($('#f-price').value);
  if(!name){toast('نام محصول را بنویس');$('#f-name').focus();return}
  if(price==null){toast('قیمت را با عدد بنویس');$('#f-price').focus();return}
  if(!d.categories.length){toast('اول یک دسته بساز');return}
  var rec={id:f.id||uid(),cat:$('#f-cat').value,name:name,desc:$('#f-desc').value.trim(),price:price,badge:$('#f-badge').value.trim(),avail:$('#f-avail').checked,img:f.img||''};
  edit(function(x){
    var i=x.products.findIndex(function(p){return p.id===rec.id});
    if(i>-1)x.products[i]=rec;else x.products.push(rec);
  });
  ui.form=null;renderDrawer();toast('محصول ثبت شد. برای نمایش به مشتری‌ها منتشرش کن.');
}

document.addEventListener('click',function(e){
  var go=e.target.closest('[data-go]');
  if(go){var t=document.getElementById(go.getAttribute('data-go'));if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});return}
  var tab=e.target.closest('[data-tab]');
  if(tab){ui.tab=tab.getAttribute('data-tab');ui.form=null;ui.confirm=null;renderDrawer();return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'), id=b.getAttribute('data-id'), d=cur();
  if(a==='open'){ui.open=true;renderDrawer()}
  else if(a==='close'){ui.open=false;ui.form=null;ui.confirm=null;renderDrawer()}
  else if(a==='publish')publish();
  else if(a==='discard'){draft=null;saveDraft();ui.form=null;renderHero();renderMenu();renderBar();renderDrawer()}
  else if(a==='new'){ui.form={id:null,name:'',price:null,cat:d.categories[0]?d.categories[0].id:'',desc:'',badge:'',avail:true,img:''};renderDrawer();$('#f-name')&&$('#f-name').focus()}
  else if(a==='edit'){var p=d.products.filter(function(x){return x.id===id})[0];if(p){ui.form=clone(p);renderDrawer()}}
  else if(a==='cancelform'){ui.form=null;renderDrawer()}
  else if(a==='saveform')saveForm();
  else if(a==='rmimg'){ui.form.img='';$('#f-prev').innerHTML=CLOUD;var fi=$('#f-img');if(fi)fi.value=''}
  else if(a==='del'){ui.confirm=id;renderDrawer()}
  else if(a==='delno'){ui.confirm=null;renderDrawer()}
  else if(a==='delyes'){ui.confirm=null;edit(function(x){x.products=x.products.filter(function(p){return p.id!==id})});renderDrawer()}
  else if(a==='avail'){edit(function(x){x.products.forEach(function(p){if(p.id===id)p.avail=(p.avail===false)})});renderDrawer()}
  else if(a==='rmsamples'){edit(function(x){x.products=x.products.filter(function(p){return !p.sample})});renderDrawer()}
  else if(a==='addcat'){var inp=$('#c-new'),n=inp.value.trim();if(!n){inp.focus();return}edit(function(x){x.categories.push({id:uid(),name:n})});renderDrawer()}
  else if(a==='ghsave')ghSave();
  else if(a==='ghout')ghOut();
  else if(a==='up')moveCat(id,-1);
  else if(a==='down')moveCat(id,1);
  else if(a==='delcat'){
    if(d.products.some(function(p){return p.cat===id})){toast('این دسته هنوز محصول دارد');return}
    edit(function(x){x.categories=x.categories.filter(function(c){return c.id!==id})});renderDrawer();
  }
});
