<style id="abra-style">body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: a always-dark night hero (lit cup, rising smoky steam, drifting sparks) ending in a wave edge; below it a sticky category strip with scroll-spy and lifted product cards. Owner drawer slides in from the start edge. */
:root{
  --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --hero-a:#120a06; --hero-b:#33200f; --hero-ink:#f8ecd6; --hero-muted:#cdb99c; --glow:#e9a650; --cl-main:#f0e2c8; --cl-shade:#c4a77f; --cl-hi:#fff8ea;
  --bg:#f3e9d7; --card:#fbf4e6; --ink:#2a1a10; --muted:#755f4b; --line:#dfcdb0; --soft:#ecdcc0;
  --accent:#d99a4a; --accent-ink:#2a1708; --price:#85441a;
  --btn:#2a1a10; --btn-ink:#f8ecd6; --danger:#b3321f;
  --shadow:0 6px 18px rgba(60,35,15,.10); --shadow-hi:0 14px 30px rgba(60,35,15,.18); --ph:#c4a77f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150d08; --card:#241610; --ink:#f4e8d2; --muted:#bba88e; --line:#3b281b; --soft:#2f1e14;
  --accent:#e0a458; --accent-ink:#2a1708; --price:#ebb978; --btn:#e0a458; --btn-ink:#1d1006; --danger:#ff9a85;
  --shadow:0 6px 18px rgba(0,0,0,.4); --shadow-hi:0 14px 30px rgba(0,0,0,.55); --ph:#6e5238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150d08; --card:#241610; --ink:#f4e8d2; --muted:#bba88e; --line:#3b281b; --soft:#2f1e14;
  --accent:#e0a458; --accent-ink:#2a1708; --price:#ebb978; --btn:#e0a458; --btn-ink:#1d1006; --danger:#ff9a85;
  --shadow:0 6px 18px rgba(0,0,0,.4); --shadow-hi:0 14px 30px rgba(0,0,0,.55); --ph:#6e5238; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.8}
#app{overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.55rem .85rem;width:100%;min-width:0}
textarea{resize:vertical;min-height:4.5rem}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

.hero .wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero-text{flex:1 1 300px;min-width:0}
.eyebrow{margin:0;font-size:.95rem;letter-spacing:.05em;color:var(--hero-muted)}
.brand{font-family:var(--font-display);font-weight:400;font-size:clamp(5rem,20vw,9.5rem);line-height:1.05;margin:.05em 0;background:linear-gradient(180deg,#fff3dc 10%,#e6b068 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 28px rgba(255,170,80,.32))}
.tag{font-size:1.15rem;color:var(--hero-ink);margin:0 0 18px;max-width:28ch;text-wrap:balance;opacity:.92}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.fact{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--hero-ink);border-radius:999px;padding:.05rem .95rem;font-size:.9rem;backdrop-filter:blur(6px)}
.cta{border:0;background:var(--glow);color:#2b1a05;font-weight:700;border-radius:999px;padding:.45rem 1.5rem;box-shadow:0 8px 24px rgba(255,170,80,.35);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,170,80,.5)}
.scene{position:relative;flex:0 1 360px;width:min(360px,78%);margin-inline:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scene svg{position:relative;z-index:1;display:block;width:100%;height:auto;overflow:visible;transform:translate(calc(var(--px,0) * 16px),calc(var(--py,0) * 10px));transition:transform .3s ease-out}
.scene .halo{position:absolute;inset:6% 4% 8%;border-radius:50%;background:radial-gradient(circle,rgba(255,181,92,.5) 0%,rgba(255,181,92,.14) 45%,transparent 70%);animation:breathe 5s ease-in-out infinite;transform:translate(calc(var(--px,0) * -22px),calc(var(--py,0) * -14px))}
.scene.hot .halo{animation:none;opacity:1;transform:scale(1.14)}
.scene .hint{position:absolute;inset-inline:0;bottom:-6px;text-align:center;font-size:.78rem;color:var(--hero-muted);opacity:.8;margin:0}
.wisp{fill:none;stroke:rgba(255,246,232,.7);stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:steam 7s ease-in-out infinite}
.wisp.once{animation:steam 3.4s ease-out 1 forwards}
.sparks{position:absolute;inset:0;pointer-events:none}
.hc{position:absolute;pointer-events:none;animation:drift 40s ease-in-out infinite alternate;filter:drop-shadow(0 0 22px rgba(255,181,92,.22))}
.hc svg,.cloud-up svg{display:block;width:100%;height:auto}
.hc1{top:34px;inset-inline-end:-24px;width:210px}
.hc2{bottom:96px;inset-inline-end:7%;width:140px;animation-duration:52s}
.hc3{top:70px;inset-inline-start:40%;width:120px;opacity:.45;animation-duration:60s}
.hc4{bottom:100px;inset-inline-start:-50px;width:220px;opacity:.28;animation-duration:46s}
.cloud-up{position:absolute;z-index:0;pointer-events:none;top:-92px;left:50%;width:74%;transform:translateX(-50%);animation:bob 8s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,181,92,.3))}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(28px)}}
@keyframes bob{50%{transform:translate(-50%,-7px)}}
.spark{position:absolute;bottom:-10px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 2px rgba(255,181,92,.7);opacity:0;animation:spark 12s linear infinite}
.wave{position:absolute;inset-inline:-5%;bottom:-1px;width:110%;height:78px;z-index:2;display:block}
.wave path{fill:var(--bg)}
.wave .w2{opacity:.45;animation:sway 9s ease-in-out infinite alternate}
@keyframes steam{0%{transform:translateY(24px) scale(.7,.5);opacity:0}22%{opacity:.85}70%{opacity:.4}100%{transform:translateY(-46px) translateX(var(--dx,10px)) scale(1.3,1.15);opacity:0}}
@keyframes breathe{50%{opacity:.7;transform:scale(1.07) translate(calc(var(--px,0) * -22px),calc(var(--py,0) * -14px))}}
@keyframes spark{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}100%{transform:translate(var(--sx,20px),-460px);opacity:0}}
@keyframes sway{to{transform:translateX(36px)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* category strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)){.strip{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}}
.strip .wrap{display:flex;gap:12px;align-items:center;padding-block:10px}
#chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.1rem 1.05rem;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.chip:hover{transform:translateY(-1px);background:var(--soft)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:0 1 190px;min-width:120px}

/* menu */
main{padding-block:30px 120px;scroll-margin-top:70px}
.sec{max-width:780px;margin:0 auto 36px;scroll-margin-top:84px}
.sec h2{font-family:var(--font-display);font-weight:400;font-size:2.2rem;line-height:1.3;margin:0 0 14px;display:flex;align-items:center;gap:14px}
.sec h2::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--accent),transparent);border-radius:2px;opacity:.7}
.grid{display:flex;flex-direction:column;gap:12px}
.item{background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:row;align-items:center;gap:14px;min-width:0;border:1px solid var(--line);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:up .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
.item:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.pic{position:relative;flex:none;width:112px;height:84px;border-radius:14px;overflow:hidden;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.item:hover .pic img{transform:scale(1.1)}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ph);background:linear-gradient(135deg,var(--soft),var(--card))}
.ph svg{width:46%;max-width:60px}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;font-weight:700;padding:0 .65rem;margin-inline-start:8px;vertical-align:middle;line-height:1.7}
.ibody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ibody h3{margin:0;font-size:1.05rem;font-weight:700;line-height:1.6}
.ibody p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-inline-end:4px}
.price{background:var(--soft);color:var(--price);font-weight:700;font-size:.95rem;border-radius:999px;padding:.05rem .85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.sold{font-size:.85rem;color:var(--muted)}
.item.off .pic{opacity:.5;filter:grayscale(.6)}
.item.off h3{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:56px 0}
.empty svg{width:96px;color:var(--ph)}
footer.foot{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 40px}

/* admin bar */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.bar>*{pointer-events:auto}
.bar .pill{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:.3rem 1rem;display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:.35rem 1.2rem;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.1rem .8rem;font-size:.9rem}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}

/* drawer */
.back{position:fixed;inset:0;background:rgba(20,10,5,.55);z-index:39}
.panel{position:fixed;inset-block:0;inset-inline-start:0;width:min(480px,100%);background:var(--card);z-index:40;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.ph-head h2{font-family:var(--font-display);font-weight:400;font-size:1.7rem;margin:0}
.tabs{display:flex;gap:6px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;border-radius:999px;padding:.1rem .9rem}
.tab[aria-selected=true]{background:var(--soft);font-weight:700}
.pbody{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.pfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:18px;min-width:0}
.row .thumb{width:44px;height:44px;border-radius:12px;background:var(--soft);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--ph)}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .thumb svg{width:26px}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta small{color:var(--muted)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:.88rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center}
.check input{width:auto}
.imgbox{display:flex;gap:12px;align-items:center}
.imgbox .thumb{width:72px;height:72px;border-radius:16px}
.note{font-size:.88rem;color:var(--muted);margin:0}
.warn{background:var(--soft);border-radius:18px;padding:10px 14px;font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#toast{position:fixed;inset-inline:0;bottom:84px;display:flex;justify-content:center;z-index:50;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);border-radius:999px;padding:.3rem 1.2rem;font-size:.92rem;box-shadow:var(--shadow)}
@media (max-width:520px){.two{grid-template-columns:1fr}.strip .wrap{flex-wrap:wrap}.search{flex:1 1 100%}.hero{padding-block:130px 110px}.scene{order:-1;width:min(260px,70%)}.pic{width:84px;height:68px}.item{gap:10px}.ibody h3{font-size:1rem}}
@media (prefers-reduced-motion:reduce){.wisp{animation:none;opacity:.5}.hc,.cloud-up{animation:none}.spark{display:none}.scene .halo,.wave .w2{animation:none}.item{animation:none}.item:hover{transform:none}html{scroll-behavior:auto}}
.steps{margin:0;padding-inline-start:1.3rem;display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.steps a{color:var(--price);word-break:break-all}
#g-owner,#g-repo,#g-token{text-align:left}

<script id="abra-script">
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var draft=null, canEdit=false, saving=false;

function cur(){return draft||state}

function parsePrice(s){var n=parseInt(toEn(s).replace(/[^0-9]/g,''),10);return isNaN(n)?null:n}
function fmt(n){return Number(n).toLocaleString('fa-IR')}

function saveDraft(){try{if(dirty())localStorage.setItem('abra-draft',JSON.stringify(draft));else localStorage.removeItem('abra-draft')}catch(e){}}

var CLOUD='<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30h32v9a16 14 0 0 1-32 0z"/><path d="M46 33h4a6 6 0 0 1 0 12h-6"/><path d="M24 22c-3-3 3-5 0-9M33 22c-3-3 3-5 0-9"/><path d="M12 56h40"/></g></svg>';

/* ---------- clouds: three layers (shade, body, highlight) so they read as puffy and lit ---------- */
var CLV=[
 {l:[[40,78,24],[72,56,32],[112,44,38],[154,56,34],[192,76,26],[60,88,22],[110,86,28],[160,88,24],[205,90,18]],t:5,b:[30,86,180,16]},
 {l:[[34,70,20],[62,52,26],[96,50,28],[126,66,22],[56,82,20],[92,82,22],[120,84,16]],t:4,b:[28,82,100,14]},
 {l:[[30,76,18],[58,62,24],[96,58,26],[138,60,24],[176,70,20],[206,82,16],[70,86,18],[120,86,20],[170,88,16]],t:5,b:[22,86,196,12]}
];
function cloudLobes(v,dy){
  return v.l.map(function(c){return '<circle cx="'+c[0]+'" cy="'+(c[1]+dy)+'" r="'+c[2]+'"/>'}).join('')+
   '<rect x="'+v.b[0]+'" y="'+(v.b[1]+dy)+'" width="'+v.b[2]+'" height="'+v.b[3]+'" rx="'+(v.b[3]/2)+'"/>';
}
function cloudSvg(i){
  var v=CLV[i%CLV.length];

  return '<svg viewBox="0 0 240 120" aria-hidden="true"><g fill="var(--cl-shade)">'+cloudLobes(v,10)+'</g><g fill="var(--cl-main)">'+cloudLobes(v,0)+'</g><g fill="var(--cl-hi)" opacity=".9">'+hi+'</g></svg>';
}

/* ---------- hero scene (built once so the steam never restarts) ---------- */
var WISPS=[
 {x:-46,w:13,d:7.2,l:-1.0,dx:-16,p:0},{x:-20,w:17,d:6.2,l:-3.4,dx:12,p:1},{x:8,w:15,d:8.1,l:-5.2,dx:-10,p:0},
 {x:36,w:12,d:6.6,l:-2.2,dx:18,p:1},{x:62,w:10,d:7.8,l:-4.6,dx:-14,p:0},{x:-4,w:11,d:9.0,l:-6.8,dx:8,p:1}
];
var WP=['M0 0C26-34-26-68 0-102S26-168 0-196','M0 0C-22-30 22-62 0-96S-24-160 0-190'];
function wispHtml(w,cls){
  return '<g transform="translate('+(180+w.x)+' 196)"><path class="wisp'+(cls?' '+cls:'')+'" d="'+WP[w.p]+'" stroke-width="'+w.w+'" style="--dx:'+w.dx+'px;'+(cls?'':'animation-duration:'+w.d+'s;animation-delay:'+w.l+'s')+'"/></g>';
}
var SCENE=
'<div class="halo"></div><div class="cloud-up">'+cloudSvg(0)+'</div>'+
'<svg viewBox="0 0 360 420" role="img" aria-label="فنجان قهوه با بخار">'+
 '<defs>'+

  '<linearGradient id="cupg" x1="0" x2="1"><stop offset="0" stop-color="#d9c5a0"/><stop offset=".45" stop-color="#fff8e8"/><stop offset="1" stop-color="#bda37a"/></linearGradient>'+

var burstTimer=null;
function burst(){
  var g=$('#steam-extra'), sc=$('.scene');if(!g)return;
  var h='';
  for(var i=0;i<5;i++){h+=wispHtml({x:-60+Math.random()*120,w:10+Math.random()*10,dx:(Math.random()-.5)*50,p:i%2},'once')}
  g.insertAdjacentHTML('beforeend',h);
  if(sc){sc.classList.add('hot');setTimeout(function(){sc.classList.remove('hot')},900)}
  clearTimeout(burstTimer);burstTimer=setTimeout(function(){g.innerHTML=''},3800);
}

function initHero(){
  var hero=$('#hero');
  var sp='';
  for(var i=0;i<18;i++){
    var s=2+Math.random()*3.5;
    sp+='<i class="spark" style="left:'+(Math.random()*100).toFixed(1)+'%;width:'+s.toFixed(1)+'px;height:'+s.toFixed(1)+'px;--sx:'+((Math.random()-.5)*90).toFixed(0)+'px;animation-duration:'+(9+Math.random()*10).toFixed(1)+'s;animation-delay:-'+(Math.random()*16).toFixed(1)+'s"></i>';
  }
  hero.innerHTML='<div class="hc hc1">'+cloudSvg(1)+'</div><div class="hc hc2">'+cloudSvg(2)+'</div><div class="hc hc3">'+cloudSvg(1)+'</div><div class="hc hc4">'+cloudSvg(0)+'</div>'+
   '<div class="sparks">'+sp+'</div>'+
   '<div class="wrap"><div class="hero-text" id="hero-text"></div><div class="scene" id="scene" role="button" tabindex="0" aria-label="بخار بیشتر">'+SCENE+'</div></div>'+

function renderHero(){
  var c=cur().cafe, facts='';
  if(c.hours)facts+='<span class="fact">ساعت کار: '+esc(c.hours)+'</span>';

function itemHtml(p,d,i){

var spy=null;
function setupSpy(){
  if(spy){spy.disconnect();spy=null}
  var secs=document.querySelectorAll('.sec');
  if(!secs.length||!('IntersectionObserver' in window))return;
  spy=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        var chips=document.querySelectorAll('.chip');
        for(var k=0;k<chips.length;k++)chips[k].classList.toggle('on',chips[k].getAttribute('data-go')===en.target.id);
        var on=$('.chip.on'),cbar=$('#chips');if(on&&cbar){var cr=cbar.getBoundingClientRect(),rr=on.getBoundingClientRect();cbar.scrollLeft+=(rr.left+rr.width/2)-(cr.left+cr.width/2)}
      }
    });
  },{rootMargin:'-25% 0px -65% 0px'});
  for(var j=0;j<secs.length;j++)spy.observe(secs[j]);
}

function renderMenu(){
  var d=cur(), q=ui.search.trim().toLowerCase(), html='', chips='', total=0;
  d.categories.forEach(function(c){
    var items=d.products.filter(function(p){
      return p.cat===c.id && (!q || (p.name+' '+(p.desc||'')).toLowerCase().indexOf(q)>-1);
    });
    total+=items.length;
    if(!items.length && !(canEdit&&!q))return;
    chips+='<button class="chip" data-go="cat-'+esc(c.id)+'">'+esc(c.name)+'</button>';
    html+='<section class="sec" id="cat-'+esc(c.id)+'"><h2>'+esc(c.name)+'</h2>'+
      (items.length?'<div class="grid">'+items.map(function(p,i){return itemHtml(p,d,i)}).join('')+'</div>':'<p class="note">این دسته هنوز محصولی ندارد.</p>')+'</section>';
  });
  if(!total && !html){
    html='<div class="empty">'+CLOUD+'<p>'+(q?'محصولی با این نام پیدا نشد.':'منو به‌زودی اینجا پر می‌شود.')+'</p></div>';
  }
  $('#chips').innerHTML=chips;
  $('#menu').innerHTML=html;
  setupSpy();
}

function renderBar(){

function catsTab(d){
  var h='<div class="two" style="grid-template-columns:1fr auto"><input id="c-new" placeholder="نام دسته‌ی جدید"><button class="btn" data-act="addcat">افزودن</button></div>';

    var used=d.products.some(function(p){return p.cat===c.id});
    h+='<div class="row"><input data-catname="'+esc(c.id)+'" value="'+esc(c.name)+'" aria-label="نام دسته"><div class="acts">'+
     '<button class="btn ghost sm" data-act="up" data-id="'+esc(c.id)+'"'+(i===0?' disabled':'')+' aria-label="بالا">↑</button>'+
     '<button class="btn ghost sm" data-act="down" data-id="'+esc(c.id)+'"'+(i===d.categories.length-1?' disabled':'')+' aria-label="پایین">↓</button>'+
     '<button class="btn ghost sm" data-act="delcat" data-id="'+esc(c.id)+'">حذف</button></div></div>'+
     (used?'<p class="note" style="margin-top:-6px">برای حذف این دسته، اول محصولاتش را جابه‌جا یا حذف کن.</p>':'');
  });
  return h;
}

}

/* ---------- publish ---------- */
/* ---------- GitHub publishing ---------- */
var gh={owner:'',repo:'',token:''};
var imgCache={};
function isrc(u){return imgCache[u]||u}
function ghLoad(){
  var o={};try{o=JSON.parse(localStorage.getItem('abra-gh')||'{}')||{}}catch(e){}
  var m=location.hostname.match(/^([^.]+)\.github\.io$/i);
  var seg=location.pathname.split('/').filter(Boolean)[0];
  gh.owner=o.owner||(m?m[1]:'');
  gh.repo=o.repo||((m&&seg&&seg.indexOf('.')<0)?seg:'');
  gh.token=o.token||'';
}
function ghStore(){try{localStorage.setItem('abra-gh',JSON.stringify(gh))}catch(e){}}
function ghApi(path){return 'https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/'+encodeURIComponent(gh.repo)+'/contents/'+path}
function ghHeaders(){return {'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function utf8ToB64(s){var b=new TextEncoder().encode(s),bin='';for(var i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);return btoa(bin)}
function b64ToUtf8(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a)}
function ghError(status){
  if(status===401)return 'توکن معتبر نیست یا منقضی شده. یک توکن جدید بساز.';
  if(status===403)return 'توکن اجازه‌ی نوشتن ندارد. در تنظیمات توکن، Contents را روی Read and write بگذار.';
  if(status===404)return 'مخزن پیدا نشد یا توکن به آن دسترسی ندارد. نام کاربری، نام مخزن و دسترسی توکن را بررسی کن.';
  if(status===409||status===422)return 'فایل هم‌زمان تغییر کرده. دوباره امتحان کن.';
  return 'خطای گیت‌هاب ('+status+'). کمی بعد دوباره امتحان کن.';
}
async function ghGetSha(path){
  var r=await fetch(ghApi(path)+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok){var e=new Error('gh');e.status=r.status;throw e}
  var j=await r.json();return j.sha||null;
}
async function ghPut(path,b64,msg,sha){
  var body={message:msg,content:b64};if(sha)body.sha=sha;
  var r=await fetch(ghApi(path),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok){var e=new Error('gh');e.status=r.status;throw e}
  return r.json();
}
function validMenu(j){return j&&j.cafe&&Array.isArray(j.categories)&&Array.isArray(j.products)}
function loadRemote(){
  var t=new Promise(function(res){setTimeout(res,6000)});
  var f=fetch('menu.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(validMenu(j))state=j}).catch(function(){});
  return Promise.race([f,t]);
}
async function loadAdminCopy(){
  try{
    var r=await fetch(ghApi('menu.json')+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
    if(r.ok){var j=await r.json();var o=JSON.parse(b64ToUtf8(String(j.content||'').replace(/\n/g,'')));if(validMenu(o))state=o}
    else if(r.status===401){toast(ghError(401))}
  }catch(e){}
}
async function publish(){
  if(saving||!dirty())return;
  if(!gh.token||!gh.owner||!gh.repo){ui.open=true;ui.tab='conn';ui.form=null;renderDrawer();toast('اول اتصال به گیت‌هاب را تنظیم کن');return}
  saving=true;renderBar();renderDrawer();
  try{
    var d=clone(draft),stamp=Date.now().toString(36);
    for(var i=0;i<d.products.length;i++){
      var p=d.products[i];
      if(p.img&&p.img.indexOf('data:')===0){
        var path='images/'+String(p.id).replace(/[^a-z0-9_-]/gi,'')+'-'+stamp+'.jpg';
        await ghPut(path,p.img.split(',')[1],'افزودن عکس محصول');
        imgCache[path]=p.img;p.img=path;
      }
    }
    var b64=utf8ToB64(JSON.stringify(d,null,1)+'\n');
    var sha=await ghGetSha('menu.json');
    try{await ghPut('menu.json',b64,'به‌روزرسانی منو',sha)}
    catch(e){
      if(e&&(e.status===409||e.status===422)){sha=await ghGetSha('menu.json');await ghPut('menu.json',b64,'به‌روزرسانی منو',sha)}
      else throw e;
    }
    state=d;draft=null;saveDraft();
    toast('منتشر شد. تا یکی دو دقیقه دیگر روی سایت دیده می‌شود.');
  }catch(e){
    toast(e&&e.status?ghError(e.status):'اتصال به گیت‌هاب برقرار نشد. اینترنت را بررسی کن.');
  }
  saving=false;renderHero();renderMenu();renderBar();renderDrawer();
}
function connTab(){
  return '<p class="note">با این اتصال، دکمه‌ی «انتشار تغییرات» مستقیم روی سایتت می‌نویسد و دیگر لازم نیست فایل دانلود و آپلود کنی. این کار فقط یک بار لازم است.</p>'+
   '<ol class="steps">'+
   '<li>به <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> برو.</li>'+
   '<li>یک اسم بنویس (مثلاً abra-menu) و زمان انقضا را روی بلندترین مدت بگذار.</li>'+
   '<li>در Repository access گزینه‌ی Only select repositories را بزن و مخزن abra را انتخاب کن.</li>'+
   '<li>در Permissions، بخش Repository permissions را باز کن و Contents را روی Read and write بگذار.</li>'+
   '<li>Generate token را بزن، توکن را کپی کن و پایین بچسبان.</li></ol>'+
   field('g-owner','نام کاربری گیت‌هاب',gh.owner,'dir="ltr" autocomplete="off"')+
   field('g-repo','نام مخزن',gh.repo,'dir="ltr" autocomplete="off"')+
   '<div class="field"><label for="g-token">توکن'+(gh.token?' (ذخیره شده است، برای عوض کردن توکن جدید بچسبان)':'')+'</label><input id="g-token" type="password" dir="ltr" autocomplete="off" placeholder="'+(gh.token?'••••••••••••':'github_pat_…')+'"></div>'+
   '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="ghsave">ذخیره و آزمایش اتصال</button>'+(gh.token?'<button class="btn danger" data-act="ghout">قطع اتصال</button>':'')+'</div>'+
   '<p class="note" id="g-status" role="status">'+(gh.token?'اتصال ذخیره شده است.':'')+'</p>'+
   '<p class="note">توکن فقط در همین مرورگر ذخیره می‌شود و داخل فایل‌های سایت نمی‌رود. روی کامپیوتر یا گوشی عمومی واردش نکن.</p>';
}
async function ghSave(){
  var o=$('#g-owner').value.trim(),r=$('#g-repo').value.trim(),t=$('#g-token').value.trim()||gh.token;
  var st=$('#g-status');
  if(!o||!r||!t){st.textContent='نام کاربری، نام مخزن و توکن را پر کن.';return}
  var prev={owner:gh.owner,repo:gh.repo,token:gh.token};
  gh.owner=o;gh.repo=r;gh.token=t;
  st.textContent='در حال آزمایش اتصال…';
  try{
    var res=await fetch('https://api.github.com/repos/'+encodeURIComponent(o)+'/'+encodeURIComponent(r),{headers:ghHeaders(),cache:'no-store'});
    if(!res.ok){gh=prev;st.textContent=ghError(res.status);return}
    var j=await res.json();
    if(j.permissions&&j.permissions.push===false){gh=prev;st.textContent='توکن فقط اجازه‌ی خواندن دارد. Contents را روی Read and write بگذار.';return}
    ghStore();
    st.textContent='اتصال برقرار شد.';
    if(!draft){await loadAdminCopy()}
    renderHero();renderMenu();renderBar();
    toast('اتصال ذخیره شد');
  }catch(e){gh=prev;st.textContent='اتصال برقرار نشد. اینترنت را بررسی کن.'}
}
function ghOut(){
  gh.token='';
  try{localStorage.removeItem('abra-gh')}catch(e){}
  ui.tab='conn';renderDrawer();toast('اتصال قطع شد');
}

/* ---------- events ---------- */
function readImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var im=new Image();
      im.onerror=rej;
      im.onload=function(){
        var m=720,k=Math.min(1,m/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function moveCat(id,dir){
  edit(function(d){
    var i=d.categories.findIndex(function(c){return c.id===id}),j=i+dir;
    if(i<0||j<0||j>=d.categories.length)return;
    var t=d.categories[i];d.categories[i]=d.categories[j];d.categories[j]=t;
  });
  renderDrawer();
}

function saveForm(){
  var d=cur(), f=ui.form;
  var name=$('#f-name').value.trim(), price=parsePrice($('#f-price').value);
  if(!name){toast('نام محصول را بنویس');$('#f-name').focus();return}
  if(price==null){toast('قیمت را با عدد بنویس');$('#f-price').focus();return}
  if(!d.categories.length){toast('اول یک دسته بساز');return}
  var rec={id:f.id||uid(),cat:$('#f-cat').value,name:name,desc:$('#f-desc').value.trim(),price:price,badge:$('#f-badge').value.trim(),avail:$('#f-avail').checked,img:f.img||''};
  edit(function(x){
    var i=x.products.findIndex(function(p){return p.id===rec.id});
    if(i>-1)x.products[i]=rec;else x.products.push(rec);
  });
  ui.form=null;renderDrawer();toast('محصول ثبت شد. برای نمایش به مشتری‌ها منتشرش کن.');
}

document.addEventListener('click',function(e){
  var go=e.target.closest('[data-go]');
  if(go){var t=document.getElementById(go.getAttribute('data-go'));if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});return}
  var tab=e.target.closest('[data-tab]');
  if(tab){ui.tab=tab.getAttribute('data-tab');ui.form=null;ui.confirm=null;renderDrawer();return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'), id=b.getAttribute('data-id'), d=cur();
  if(a==='open'){ui.open=true;renderDrawer()}
  else if(a==='close'){ui.open=false;ui.form=null;ui.confirm=null;renderDrawer()}
  else if(a==='publish')publish();
  else if(a==='discard'){draft=null;saveDraft();ui.form=null;renderHero();renderMenu();renderBar();renderDrawer()}
  else if(a==='new'){ui.form={id:null,name:'',price:null,cat:d.categories[0]?d.categories[0].id:'',desc:'',badge:'',avail:true,img:''};renderDrawer();$('#f-name')&&$('#f-name').focus()}
  else if(a==='edit'){var p=d.products.filter(function(x){return x.id===id})[0];if(p){ui.form=clone(p);renderDrawer()}}
  else if(a==='cancelform'){ui.form=null;renderDrawer()}
  else if(a==='saveform')saveForm();
  else if(a==='rmimg'){ui.form.img='';$('#f-prev').innerHTML=CLOUD;var fi=$('#f-img');if(fi)fi.value=''}
  else if(a==='del'){ui.confirm=id;renderDrawer()}
  else if(a==='delno'){ui.confirm=null;renderDrawer()}
  else if(a==='delyes'){ui.confirm=null;edit(function(x){x.products=x.products.filter(function(p){return p.id!==id})});renderDrawer()}
  else if(a==='avail'){edit(function(x){x.products.forEach(function(p){if(p.id===id)p.avail=(p.avail===false)})});renderDrawer()}
  else if(a==='rmsamples'){edit(function(x){x.products=x.products.filter(function(p){return !p.sample})});renderDrawer()}
  else if(a==='addcat'){var inp=$('#c-new'),n=inp.value.trim();if(!n){inp.focus();return}edit(function(x){x.categories.push({id:uid(),name:n})});renderDrawer()}
  else if(a==='ghsave')ghSave();
  else if(a==='ghout')ghOut();
  else if(a==='up')moveCat(id,-1);
  else if(a==='down')moveCat(id,1);
  else if(a==='delcat'){
    if(d.products.some(function(p){return p.cat===id})){toast('این دسته هنوز محصول دارد');return}
    edit(function(x){x.categories=x.categories.filter(function(c){return c.id!==id})});renderDrawer();
  }
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.search=t.value;renderMenu();return}
  if(t.hasAttribute&&t.hasAttribute('data-catname')){var cid=t.getAttribute('data-catname');edit(function(x){x.categories.forEach(function(c){if(c.id===cid)c.name=t.value})});return}
  var map={'k-name':'name','k-tag':'tagline','k-hours':'hours','k-addr':'address','k-cur':'currency'};
  if(map[t.id]){edit(function(x){x.cafe[map[t.id]]=t.value});}
});

document.addEventListener('change',function(e){
  if(e.target.id==='f-img'&&e.target.files&&e.target.files[0]){
    var file=e.target.files[0];
    if(file.type.indexOf('image/')!==0){toast('فقط فایل عکس قابل قبول است');return}
    readImage(file).then(function(u){ui.form.img=u;$('#f-prev').innerHTML='<img src="'+u+'" alt="">'}).catch(function(){toast('این عکس خوانده نشد')});
  }
});

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.open){ui.open=false;ui.form=null;renderDrawer()}});

$('#app').innerHTML='<header class="hero" id="hero"></header>'+
 '<nav class="strip" aria-label="دسته‌های منو"><div class="wrap"><div id="chips"></div><input id="q" class="search" type="search" placeholder="جست‌وجو در منو" aria-label="جست‌وجو در منو"></div></nav>'+
 '<main class="wrap" id="menu"></main><footer class="foot">ابرا · منوی آنلاین</footer>'+
 '<div class="bar" id="bar" hidden></div><div id="drawer"></div><div id="toast" role="status" aria-live="polite"></div>';
ghLoad();
canEdit=(location.hash==='#admin');
window.addEventListener('hashchange',function(){location.reload()});
initHero();
$('#menu').innerHTML='<div class="empty"><p>در حال بارگذاری منو…</p></div>';
(async function(){
  await loadRemote();
  if(canEdit&&gh.token)await loadAdminCopy();
  if(canEdit){try{var sd=localStorage.getItem('abra-draft');if(sd){var dd=JSON.parse(sd);if(JSON.stringify(dd)!==JSON.stringify(state))draft=dd;else localStorage.removeItem('abra-draft')}}catch(e){}}
  renderHero();renderMenu();renderBar();
})();
})();
